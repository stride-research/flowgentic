# Weekly pull requests that update uv.lock and the workflows' actions, each
# ecosystem grouped into one pull request. Dependabot's uv support has gaps,
# so the newest-dependencies workflow is the signal to rely on.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # The ranges in pyproject.toml are chosen by hand, and some bounds say why
    # in a comment. Dependabot's default strategy for a library widens them to
    # admit a new release, so it only updates uv.lock within them.
    versioning-strategy: "lockfile-only"
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

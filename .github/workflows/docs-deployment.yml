name: Deploy MkDocs
# The site describes the latest release, not main: it deploys when a release
# is published, or by hand for a given tag. Pull requests still build the
# documentation strictly in the CI workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to deploy, for example v0.3.1"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.ref }}
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen --extra dev mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4

name: LLM examples

# Runs the design-pattern examples against a live model on OpenRouter. CI runs
# them offline with a scripted chat model; this run needs the repository
# secret OPEN_ROUTER_API_KEY and spends credits, so a maintainer starts it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  llm_examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # make's uv commands use uv.lock as it is
      UV_FROZEN: "1"
    steps:
      - name: Fetch code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true

      # Without the key, the examples fail on their first model call; this
      # step says why before anything is installed.
      - name: Check the secret
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
        run: |
          if [ -z "$OPEN_ROUTER_API_KEY" ]; then
            echo "::error::Add the repository secret OPEN_ROUTER_API_KEY first."
            exit 1
          fi

      - name: "Install dependencies"
        run: uv sync --frozen --extra dev

      - name: Run the examples live
        env:
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
        run: make tests-integration-llm

[project]
name = "flowgentic"
version = "0.3.1"
description = "A library to enable running agentic frameworks on HPC environments."
readme = "README.md"
authors = [
    { name = "Javier Dominguez", email = "jdominguez.ieu2023@student.ie.edu"},
    { name = "Yousef Amirghofran", email = "yamirghofran.ieu2023@student.ie.edu" },
    { name = "Matteo Turilli", email = "mturilli@faculty.ie.edu"}
]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0,<2.0",
    "radical-asyncflow==0.6.0",
    "langchain-openai",
    "langchain>=1.0,<2.0",
    "langchain-ollama",
    "langchain-core>=1.0,<2.0",
    "pydantic>=2.0.0",
    "python-json-logger>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
examples = [
    "python-dotenv",
    "academy-py>=1.0,<2",
]
dev = [
    "flowgentic[examples]",
    "ruff>=0.12.11",
    "pre-commit",
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions",
    "mkdocs_gen_files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
include = ["./src/*", ]
extend-exclude = [".uv-cache", "*.egg-info", "build", "site"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
      "N",
      "ANN",
      "TID",
      "E",
      "C4",
      "G",
      "FAST001",
      "FAST002",
      "FAST003",
      "ASYNC100",
      "S101",
      "S105",
      "S106",
      "S107",
      "S310",
      "S311",
      "I", # isort
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"

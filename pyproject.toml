[project]
name = "flowgentic"
version = "0.1.0"
description = "A library to enable running agentic frameworks on HPC environments."
readme = "README.md"
authors = [
    { name = "Javier Dominguez", email = "jdominguez.ieu2023@student.ie.edu"},
    { name = "Yousef Amirghofran", email = "yamirghofran.ieu2023@student.ie.edu" },
    { name = "Matteo Turilli", email = "mturilli@faculty.ie.edu"}
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "python-json-logger>=2.0.0",
    "python-dotenv",
    "cloudpickle>=3.1.2",
]

[project.optional-dependencies]
# --- Per-component extras (pick only what you need) ---
langgraph = [
    "langgraph>=0.6.6",
    "langchain-openai",
    "langchain",
    "langchain-ollama",
    "langchain-core",
    "langchain-community",
    "langchain-mcp-adapters",
]
crewai = [
    "crewai[google-genai]",
]
autogen = [
    "autogen>=0.10.4",
]
asyncflow = [
    "radical-asyncflow",
]
parsl = [
    "parsl>=2026.1.19",
]
academy = [
    "academy-py",
]
# --- Convenience bundles ---
frameworks = [
    "flowgentic[langgraph,crewai,autogen]",
]
runtime = [
    "flowgentic[asyncflow,parsl,academy]",
]
all = [
    "flowgentic[frameworks,runtime]",
]
dev = [
    "ruff>=0.12.11",
    "pre-commit",
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions",
    "mkdocs_gen_files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "uv>=0.1.0",
    "pytest-cov",
    "matplotlib",
    "cloudpickle",
]

[project.scripts]
flowgentic = "flowgentic:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
include = ["./src/*", ]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
      "N",
      "ANN",
      "TID",
      "E",
      "C4",
      "G",
      "FAST001",
      "FAST002",
      "FAST003",
      "ASYNC100",
      "S101",
      "S105",
      "S106",
      "S107",
      "S310",
      "S311",
      "I", # isort
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]

[tool.uv.sources]
academy-py = { git = "https://github.com/proxystore/academy" }
radical-asyncflow = { git = "https://github.com/radical-cybertools/radical.asyncflow.git", branch = "main" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Exclude tests whose modules no longer exist on this branch
addopts = [
    "--ignore=tests/integration",
    "--ignore=tests/unit/test_generator.py",
    "--ignore=tests/unit/test_introspection.py",
    "--ignore=tests/unit/test_memory.py",
]

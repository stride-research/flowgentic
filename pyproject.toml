[project]
name = "flowgentic"
version = "0.1.0"
description = "Execution coordination layer for adaptive, agent-driven HPC workflows"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "radical-asyncflow>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowgentic"]

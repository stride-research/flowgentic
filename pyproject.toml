[project]
name = "flowgentic"
version = "0.5.1"
description = "Flowgentic runs LLM agents on HPC resources with the RADICAL stack: as AsyncFlow workflow tasks, and as LangGraph agents at scale whose tools run as RHAPSODY tasks and whose state lives in RaDEX."
readme = "README.md"
authors = [
    { name = "Javier Dominguez", email = "jdominguez.ieu2023@student.ie.edu"},
    { name = "Yousef Amirghofran", email = "yamirghofran.ieu2023@student.ie.edu" },
    { name = "Matteo Turilli", email = "mturilli@faculty.ie.edu"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
# Core: what every path needs. Each path adds an extra: `langgraph` for
# LangGraph graphs and LangChain agents, `asyncflow` for AsyncFlow workflows,
# `rhapsody` for tools that run as RHAPSODY tasks, `mcp` for the tool service's
# MCP clients.
dependencies = [
    "pydantic>=2.0.0",
    "opentelemetry-api>=1.43,<2",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.1.5,<2.0",
    "langgraph-checkpoint>=4.3,<5",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-ollama>=1.0,<2.0",
]
asyncflow = [
    "radical-asyncflow>=0.7,<0.8",
]
rhapsody = [
    "rhapsody-py>=0.7,<0.8",
]
mcp = [
    "mcp>=2.3,<2.4",
]
examples = [
    "flowgentic[langgraph,asyncflow]",
    "python-dotenv>=1.0",
    "academy-py>=1.0,<2",
    "opentelemetry-sdk>=1.43,<2",
    "opentelemetry-instrumentation-genai-langchain>=1.3b0,<1.4",
    "opentelemetry-instrumentation-genai-openai>=1.3b0,<1.4",
    "rhapsody-py[telemetry]>=0.7,<0.8",
]
dev = [
    "flowgentic[examples,rhapsody,mcp]",
    "ruff>=0.12.11",
    "pre-commit>=4.0",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=1.0.7",
    "pymdown-extensions>=10.16",
    "mkdocs_gen_files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-section-index>=0.3.10",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/stride-research/flowgentic"
Documentation = "https://stride-research.github.io/flowgentic/"
Repository = "https://github.com/stride-research/flowgentic"
Issues = "https://github.com/stride-research/flowgentic/issues"
Changelog = "https://github.com/stride-research/flowgentic/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Inline type annotations, for type checkers (PEP 561).
[tool.setuptools.package-data]
flowgentic = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"
include = ["./src/*", ]
extend-exclude = [".uv-cache", "*.egg-info", "build", "site"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
      "N",
      "ANN",
      "TID",
      "E",
      "C4",
      "G",
      "FAST001",
      "FAST002",
      "FAST003",
      "ASYNC100",
      "S101",
      "S105",
      "S106",
      "S107",
      "S310",
      "S311",
      "I", # isort
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "dragon: needs a Dragon runtime, RaDEX and RHAPSODY's Dragon backends; skipped unless run under `dragon` (tests/_dragon.py)",
]

[project]
name = "flowgentic"
version = "0.1.0"
description = "Execution coordination layer for adaptive, agent-driven HPC workflows"
readme = "README.md"
# 3.11, not 3.13: this package has to be installable into the IE cluster's EESSI venv,
# which is Python 3.11.3/3.11.4. Nothing in src/flowgentic/ needs newer syntax (checked:
# no PEP-695 type params, no 3.12+ constructs). Raising this again would silently make
# the package uninstallable on the cluster, which is where it actually has to run.
requires-python = ">=3.11"

# Intentionally empty: every module in src/flowgentic/ imports stdlib only (json, time,
# dataclasses, enum, itertools, pathlib, typing). Keeping it that way is a hard
# requirement, not an accident: this package is reinstalled with `--no-deps -e` on every
# job (scripts/run_sbatch.sh), specifically so that step never triggers pip's resolver
# against the cluster venv's explicitly pinned science stack (numpy/scipy/torch/pyrosetta,
# see context/current-implementation.md "UPDATE 2026-10-20"). A dependency declared here
# would get silently skipped by --no-deps anyway, so add it to the venv explicitly instead
# of here if it's needed at runtime. Demo-only deps live in the `demos` extra below.
dependencies = []

[project.optional-dependencies]
# What a usecase repo built on top of flowgentic (e.g. cnio_usecase, split out from this
# repo's former demos/cnio/ on 2026-10-20) needs but src/flowgentic/ itself does not.
# Install locally with `uv sync --extra demos`; do NOT install this extra on the cluster
# (see `dependencies`). matplotlib was previously a hard dependency and is dropped
# entirely -- grepped, nothing in src/ imports it.
demos = [
    "radical-asyncflow>=0.5.1",
    # Used directly by cnio_usecase's metrics/schema.py.
    "pydantic>=2.0",
    # Used directly by cnio_usecase's e2e/1_sync/flowgentic/src/main.py to load .env locally.
    # Zero dependencies of its own, but still needs its own explicit install step on the
    # cluster (scripts/run_sbatch.sh) -- same reason radical-asyncflow/rhapsody do: this
    # extra is never installed there, per the comment on `dependencies` above.
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowgentic"]

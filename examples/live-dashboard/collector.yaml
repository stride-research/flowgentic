# The collector takes each process's OTLP and passes metrics to Prometheus's
# OTLP receiver and spans to Jaeger. On an allocation, run it where the agent
# processes can reach it, and point their flowgentic.otlp.configure() at it.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  # Model servers' own metrics, such as vLLM's, scraped beside the agents':
  # prometheus:
  #   config:
  #     scrape_configs:
  #       - job_name: vllm
  #         scrape_interval: 5s
  #         static_configs:
  #           - targets: ["node-1:8000"]

processors:
  batch: {}

exporters:
  otlp_http/prometheus:
    metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]

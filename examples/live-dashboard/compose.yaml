# A live dashboard for a Flowgentic run: an OpenTelemetry collector, Prometheus
# for the metrics, Jaeger for the sampled traces, and Grafana with Flowgentic's
# and RHAPSODY's dashboards. Every port is bound to 127.0.0.1.
#
#     docker compose -f examples/live-dashboard/compose.yaml up -d
#
# Then run the agent processes with flowgentic.otlp.configure() (the otlp
# extra), and open http://localhost:3000. An application's own dashboards go
# in the Application folder: APP_DASHBOARDS=/path/to/dir docker compose ... up -d
name: flowgentic-live

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"  # OTLP/HTTP, what flowgentic.otlp sends
      - "127.0.0.1:4317:4317"  # OTLP/gRPC
    depends_on: [prometheus, jaeger]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/jaeger:2.23.0  # in memory: traces go when it stops
    ports:
      - "127.0.0.1:16686:16686"  # its own UI
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # viewers need no login; admin/admin edits
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: ${HOME_DASHBOARD:-/var/lib/grafana/dashboards/components/Flowgentic/flowgentic.json}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards/components:ro
      - ${APP_DASHBOARDS:-./application}:/var/lib/grafana/dashboards/application:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, jaeger]
    restart: unless-stopped

volumes:
  prometheus:
  grafana:
